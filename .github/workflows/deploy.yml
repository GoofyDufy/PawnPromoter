# Publishes KingSide Coach to GitHub Pages on every push to main: install, test, build, deploy.
# The site is static (everything runs in the visitor's browser), so the build's dist/ folder is all of it.
# One-time setup on GitHub: Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:          # (or run it by hand from the Actions tab)

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:                  # one deploy at a time; a newer push replaces a waiting one
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx vitest run          # a failing test stops the deploy
      - run: npm run build           # copies Stockfish into public/engine/, type-checks, builds dist/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
