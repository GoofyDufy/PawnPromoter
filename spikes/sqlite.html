<!doctype html>
<meta charset="utf-8">
<title>SQLite OPFS spike</title>
<script type="module">
const phase = new URLSearchParams(location.search).get("phase") || "import";
const w = new Worker(`sqlite-worker.mjs?phase=${phase}`, { type: "module" });
const send = (d) => fetch("/report", { method: "POST", body: JSON.stringify(d) });
w.onmessage = async (e) => { await send(e.data); await send({ done: true }); };
w.onerror = async (e) => { await send({ spike: "sqlite", error: "worker: " + e.message }); await send({ done: true }); };
</script>
